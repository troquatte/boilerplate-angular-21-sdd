@if (routerPath().startsWith(routerPathDashboardAdmin)) {
  <div class="d-flex justify-content-between">
    <app-menu-dashboard-admin />
    <main class="container-fluid container-wraper">
      <router-outlet />
    </main>
  </div>
} @else if (routerPath().startsWith('/design-system')) {
  <div class="d-flex justify-content-between">
    <app-menu-design-system />
    <main class="container-fluid container-wraper">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
