<h1>Clientes</h1>

<div class="clientes-toolbar">
  <div class="theme-form-field clientes-toolbar__search">
    <input
      class="theme-form-field__input form-control"
      type="text"
      placeholder="Busque por Telefone ou CPF"
    />
  </div>
  <button class="theme-btn theme-btn__secondary">Novo cliente</button>
</div>

<table class="theme-table">
  <thead>
    <tr>
      <th>Nome completo</th>
      <th>Telefone</th>
      <th>CPF</th>
      <th>CEP</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    @for (cliente of clientes(); track cliente.id) {
      <tr>
        <td>{{ cliente.fullName }}</td>
        <td>{{ cliente.phone }}</td>
        <td>{{ cliente.cpf }}</td>
        <td>{{ cliente.cep }}</td>
        <td class="theme-table__actions">
          <button
            class="theme-btn theme-btn__secondary"
            (click)="onEdit(cliente)"
            title="Editar"
          >
            Editar
          </button>
          <button
            class="theme-btn theme-btn__danger-line"
            (click)="onDelete(cliente)"
            title="Deletar"
          >
            Deletar
          </button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="theme-table__empty">Nenhum cliente encontrado.</td>
      </tr>
    }
  </tbody>
</table>
