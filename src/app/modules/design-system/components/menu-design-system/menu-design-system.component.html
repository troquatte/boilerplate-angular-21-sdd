<app-menu-left-container class="ex-hide-on-mobile">
  <ng-container>
    <ul>
      @for (item of navItems; track item.id) {
        <li>
          <a
            [href]="'#' + item.id"
            (click)="$event.preventDefault(); scrollTo(item.id)"
            title="{{ item.label }}"
          >
            <!-- <span [innerHTML]="icons.iconCoursesHome"></span> -->
            <p>{{ item.label }}</p>
          </a>
        </li>
      }
    </ul>

    <ul>
      <li>
        <a [routerLink]="['', ERouters.AUTH]" title="Sair">
          <span [innerHTML]="icons.iconLogoutMenu"></span>
          <p>Sair</p>
        </a>
      </li>
    </ul>
  </ng-container>
</app-menu-left-container>

<app-menu-bottom-container
  class="ex-show-on-mobile"
  [homeRouterLink]="['/', ERouters.ADMIN, ERouters.DASHBOARD]"
>
  <ng-container>
    <ul>
      @for (item of navItems; track item.id) {
        <li>
          <a
            [href]="'#' + item.id"
            (click)="$event.preventDefault(); scrollTo(item.id)"
            title="{{ item.label }}"
          >
            <!-- <span [innerHTML]="icons.iconCoursesHome"></span> -->
            <p>{{ item.label }}</p>
          </a>
        </li>
      }
    </ul>

    <ul>
      <li>
        <a [routerLink]="['', ERouters.AUTH]" title="Sair">
          <span [innerHTML]="icons.iconLogoutMenu"></span>
          <p>Sair</p>
        </a>
      </li>
    </ul>
  </ng-container>
</app-menu-bottom-container>
