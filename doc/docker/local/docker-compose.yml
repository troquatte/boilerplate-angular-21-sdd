version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: boilerplate-postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boilerplate_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: boilerplate-redis-local
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z-cpuv1
    container_name: boilerplate-minio-local
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: "@Pamonhapamonha191_"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_local:/data

volumes:
  postgres_data_local:
    driver: local
  minio_data_local:
    driver: local
